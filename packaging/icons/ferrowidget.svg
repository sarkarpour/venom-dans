<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="fluidGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3a4454"/>
      <stop offset="40%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>
    <radialGradient id="glintGrad" cx="30%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#99bbdd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14171d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow & Rim -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.35" filter="url(#softGlow)"/>
  
  <!-- Droplet Mother Mass -->
  <path d="M 128,48 C 175,48 208,85 208,132 C 208,175 172,208 128,208 C 84,208 48,175 48,132 C 48,92 82,48 128,48 Z" fill="url(#fluidGrad)" stroke="#6688aa" stroke-width="1.5"/>
  
  <!-- Satellites -->
  <circle cx="198" cy="80" r="14" fill="url(#fluidGrad)" stroke="#557799" stroke-width="1"/>
  <circle cx="58" cy="165" r="10" fill="url(#fluidGrad)" stroke="#557799" stroke-width="1"/>
  <circle cx="185" cy="182" r="12" fill="url(#fluidGrad)" stroke="#557799" stroke-width="1"/>
  <circle cx="75" cy="78" r="8" fill="url(#fluidGrad)" stroke="#557799" stroke-width="1"/>
  
  <!-- Specular Highlights -->
  <ellipse cx="108" cy="98" rx="34" ry="22" transform="rotate(-25 108 98)" fill="url(#glintGrad)"/>
  <circle cx="195" cy="76" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="183" cy="179" r="3.5" fill="#ffffff" opacity="0.75"/>
</svg>