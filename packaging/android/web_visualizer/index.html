<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <title>FerroWidget Mobile - ویجت رقص فروسیال</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #11141a 0%, #05070a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Helvetica, Arial, sans-serif;
      color: #e0e5eb;
    }
    #glcanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      z-index: 1;
    }

    /* Notification Toast */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(18, 22, 28, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: #f0f4f8;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 229, 255, 0.2);
      max-width: 90vw;
      text-align: center;
      direction: rtl;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    #toast.error {
      border-color: rgba(255, 77, 77, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 77, 77, 0.2);
    }
    #toast.success {
      border-color: rgba(0, 230, 118, 0.6);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(0, 230, 118, 0.2);
    }

    /* Audio Player Floating Card */
    #player-card {
      position: absolute;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: rgba(15, 19, 26, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: calc(100% - 32px);
      max-width: 440px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      direction: rtl;
    }
    #player-card.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .track-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }
    .track-name {
      font-size: 13px;
      font-weight: 600;
      color: #00e5ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-time {
      font-size: 11px;
      color: #8a99a8;
      font-variant-numeric: tabular-nums;
      direction: ltr;
    }
    .player-btns {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .icon-btn:active {
      background: #00e5ff;
      color: #05070a;
      transform: scale(0.92);
    }
    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      direction: ltr;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00e5ff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 229, 255, 0.6);
    }

    /* HUD Controls */
    .hud {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
      background: rgba(15, 19, 26, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 12px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: calc(100% - 24px);
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      direction: rtl;
    }
    .hud-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .hud-row::-webkit-scrollbar {
      display: none;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #e0e5eb;
      padding: 7px 12px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn.active {
      background: #00e5ff;
      color: #05070a;
      font-weight: 600;
      border-color: #00e5ff;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.45);
    }
    .btn.active-warn {
      background: #ffaa00;
      color: #05070a;
      font-weight: 600;
      border-color: #ffaa00;
      box-shadow: 0 0 14px rgba(255, 170, 0, 0.45);
    }
    .btn-primary {
      background: rgba(0, 229, 255, 0.15);
      border-color: rgba(0, 229, 255, 0.35);
      color: #00e5ff;
    }
    .btn-primary:active, .btn-primary.active {
      background: #00e5ff;
      color: #05070a;
    }
  </style>
</head>
<body>
  <div id="toast">پیام سیستم</div>
  <canvas id="glcanvas"></canvas>

  <!-- Audio Player Floating Bar (shown when song or demo is active) -->
  <div id="player-card">
    <div class="player-row">
      <div class="track-info">
        <span class="track-name" id="track-name">موزیک انتخاب شده</span>
      </div>
      <div class="player-btns">
        <button class="icon-btn" id="play-pause-btn" title="پخش / مکث">⏸️</button>
        <button class="icon-btn" id="close-player-btn" title="بستن و توقف">✕</button>
      </div>
    </div>
    <div class="progress-bar-container">
      <input type="range" class="progress-bar" id="track-progress" min="0" max="100" value="0">
      <span class="track-time" id="track-time">0:00 / 0:00</span>
    </div>
  </div>

  <!-- HUD Bottom Bar -->
  <div class="hud">
    <!-- Row 1: Visual Themes -->
    <div class="hud-row">
      <button class="btn active theme-btn" data-theme="ink">جوهری (Ink)</button>
      <button class="btn theme-btn" data-theme="mercury">جیوه (Chrome)</button>
      <button class="btn theme-btn" data-theme="oilslick">روغنی (Oilslick)</button>
      <button class="btn theme-btn" data-theme="neon">نئون (Neon)</button>
    </div>
    <!-- Row 2: Audio Inputs & Controls -->
    <div class="hud-row">
      <button class="btn btn-primary" id="audio-file-btn">🎵 انتخاب آهنگ</button>
      <button class="btn" id="demo-btn">🎶 تست دمو</button>
      <button class="btn" id="mic-btn">🎤 میکروفون</button>
      <input type="file" id="audio-file-input" accept="audio/*" style="display: none;">
      <audio id="audio-element" preload="auto"></audio>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
