<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0c10">
  <title>FerroWidget Mobile</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at center, #11141a 0%, #05070a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #glcanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: block; touch-action: none;
    }
    .hud {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 10;
      background: rgba(18, 22, 28, 0.75);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      padding: 8px 12px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn {
      background: rgba(255, 255, 255, 0.08); border: none; color: #e0e5eb;
      padding: 8px 14px; border-radius: 16px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease;
    }
    .btn.active, .btn:active {
      background: #00e5ff; color: #05070a; font-weight: 600;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.4);
    }
  </style>
</head>
<body>
  <canvas id="glcanvas"></canvas>
  <div class="hud">
    <button class="btn active theme-btn" data-theme="ink">Ink</button>
    <button class="btn theme-btn" data-theme="mercury">Chrome</button>
    <button class="btn theme-btn" data-theme="oilslick">Oilslick</button>
    <button class="btn theme-btn" data-theme="neon">Neon</button>
    <button class="btn" id="mic-btn">🎤 Mic</button>
  </div>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
