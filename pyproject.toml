[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrowidget"
version = "0.1.0"
description = "A photorealistic ferrofluid desktop widget dancing to Ubuntu system audio"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Staff Real-Time Graphics Engineer"}
]
dependencies = [
    "PySide6>=6.5.0",
    "moderngl>=5.8.0",
    "PyOpenGL>=3.1.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "tomli-w>=1.0.0",
    "python-xlib>=0.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
ferrowidget = "ferrowidget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ferrowidget.render" = ["shaders/*.vert", "shaders/*.frag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
